<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cyber IP Address Tracker - Lacak lokasi geografis berdasarkan alamat IP atau domain">
  <meta name="theme-color" content="#0d0e15">
  
  <title>Cyber IP Address Tracker</title>

  <!-- Preconnect untuk performa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://{s}.basemaps.cartocdn.com">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke peta</a>

  <header class="header-hero">
    <div class="top-bar">
      <h1 class="title">
        IP TRACKER <span class="badge">PRO</span>
      </h1>

      <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Ganti tema">
        <span class="icon-sun" aria-hidden="true">☀️</span>
        <span class="icon-moon" aria-hidden="true">🌙</span>
      </button>
    </div>

    <form id="search-form" class="search-container" novalidate>
      <input 
        type="text" 
        id="ip-input" 
        class="search-input" 
        placeholder="Masukkan IP address atau domain..." 
        autocomplete="off"
        aria-label="Masukkan IP address atau domain"
      />
      <button type="submit" class="search-btn" aria-label="Cari lokasi">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <section class="info-card" aria-label="Detail informasi IP" aria-live="polite">
      <article class="info-item">
        <h2 class="info-label">IP Address</h2>
        <p id="ip-display" class="info-value">
          <span class="skeleton-loader"></span>
        </p>
      </article>

      <article class="info-item">
        <h2 class="info-label">Lokasi</h2>
        <p id="location-display" class="info-value">
          <span class="skeleton-loader"></span>
        </p>
      </article>

      <article class="info-item">
        <h2 class="info-label">Zona Waktu</h2>
        <p id="timezone-display" class="info-value">
          <span class="skeleton-loader"></span>
        </p>
      </article>

      <article class="info-item">
        <h2 class="info-label">ISP</h2>
        <p id="isp-display" class="info-value">
          <span class="skeleton-loader"></span>
        </p>
      </article>
    </section>
  </header>

  <main id="main-content" class="map-wrapper">
    <div id="map" role="application" aria-label="Peta lokasi IP"></div>
  </main>

  <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a href="#" rel="noopener noreferrer">Ahmad Asrari</a>.</p>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

  <!-- Custom JS -->
  <script src="./script.js"></script>
</body>
</html>
