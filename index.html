<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IP Address Tracker - Search for any IP address or domain to see its physical location on a map.">
  
  <title>IP Address Tracker</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Skip to main content for accessibility -->
  <a href="#main-content" class="skip-link">Skip to map</a>

  <header class="header">
    <div class="header__container">
      <h1 class="header__title">IP Address Tracker</h1>
      
      <form id="search-form" class="search" novalidate>
        <label for="ip-input" class="visually-hidden">Search for any IP address or domain</label>
        <input 
          type="text" 
          id="ip-input" 
          class="search__input" 
          placeholder="Search for any IP address or domain"
          autocomplete="off"
          aria-describedby="search-error"
        >
        <button type="submit" class="search__btn" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="11" height="14" viewBox="0 0 11 14" fill="none" aria-hidden="true" focusable="false">
            <path d="M2 1L8 7L2 13" stroke="white" stroke-width="3"/>
          </svg>
        </button>
      </form>

      <div id="search-error" class="search__error" role="alert" aria-live="polite"></div>
    </div>
  </header>

  <main id="main-content">
    <section class="info-card" aria-label="IP Information">
      <div class="info-card__item">
        <h2 class="info-card__label">IP Address</h2>
        <p id="ip-display" class="info-card__value">
          <span class="skeleton" aria-hidden="true"></span>
        </p>
      </div>
      
      <div class="info-card__item">
        <h2 class="info-card__label">Location</h2>
        <p id="location-display" class="info-card__value">
          <span class="skeleton" aria-hidden="true"></span>
        </p>
      </div>
      
      <div class="info-card__item">
        <h2 class="info-card__label">Timezone</h2>
        <p id="timezone-display" class="info-card__value">
          <span class="skeleton" aria-hidden="true"></span>
        </p>
      </div>
      
      <div class="info-card__item">
        <h2 class="info-card__label">ISP</h2>
        <p id="isp-display" class="info-card__value">
          <span class="skeleton" aria-hidden="true"></span>
        </p>
      </div>
    </section>

    <section class="map-section" aria-label="Map location">
      <div id="map"></div>
    </section>
  </main>

  <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a href="#" rel="noopener noreferrer">Ahmad Asrari</a>.</p>
  </footer>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

  <!-- Custom JS -->
  <script src="./script.js"></script>
</body>
</html>
