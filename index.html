<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber IP Address Tracker</title>

  <!-- Google Fonts: Space Grotesk & Rubik -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header-hero">
    <div class="top-bar">
      <h1 class="title">IP TRACKER <span class="badge">PRO</span></h1>
      
      <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle Theme">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>
    </div>
    
    <form id="search-form" class="search-container" role="search" aria-label="Form pencarian IP atau domain">
      <input 
        type="text" 
        id="ip-input" 
        class="search-input" 
        placeholder="Masukkan IP address atau domain..."
        autocomplete="off"
        required
        aria-required="true"
      >
      <button type="submit" class="search-btn" aria-label="Cari IP atau domain">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <section class="info-card" aria-label="Detail IP Geolocation">
      <article class="info-item">
        <h2 class="info-label">IP ADDRESS</h2>
        <p id="ip-display" class="info-value">-</p>
      </article>

      <article class="info-item">
        <h2 class="info-label">LOCATION</h2>
        <p id="location-display" class="info-value">-</p>
      </article>

      <article class="info-item">
        <h2 class="info-label">TIMEZONE</h2>
        <p id="timezone-display" class="info-value">-</p>
      </article>

      <article class="info-item">
        <h2 class="info-label">ISP</h2>
        <p id="isp-display" class="info-value">-</p>
      </article>
    </section>
  </header>

  <main class="map-wrapper">
    <div id="map" role="application" aria-label="Peta interaktif lokasi IP"></div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>. 
    Coded by <a href="#">Ahmad Asrari</a>.
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Custom JS -->
  <script src="js/script.js"></script>
</body>
</html>
